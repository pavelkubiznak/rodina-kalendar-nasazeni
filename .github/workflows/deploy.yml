name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # denně 5:00 SELČ – přegeneruje svátky a .ics
    - cron: '0 19 * * *'  # 21:00 SELČ / 20:00 SEČ – plakát na zítřek pro The Frame (viz krok níže)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Vygenerovat svátky a ICS feed
        run: |
          node scripts/gen-svatky.mjs
          node scripts/plan-knihovna.mjs --write
          node scripts/build-ics.mjs

      - name: Commit vygenerovaných souborů
        run: |
          git config user.name  "rodinny-kalendar-bot"
          git config user.email "actions@github.com"
          git add data/svatky.json data/knihovna-plan.json rodina.ics
          git diff --staged --quiet || git commit -m "chore: přegenerované svátky a ICS feed"
          git push
        continue-on-error: true

      # Plakát pro The Frame (frame-auto/). Po 18:00 pražského času se renderuje zítřek:
      # plánované běhy GitHubu tu chodí i o 4–5 hodin později, takže na ranní cron se
      # upload v 5:30 spolehnout nemůže — večerní běh má rezervu přes celou noc.
      - name: Plakát pro The Frame
        continue-on-error: true   # když selže Chromium, web se nasadí i tak, jen bez plakátu
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/build-frame-data.mjs > frame-data.json
          node frame-auto/render/render.mjs frame-data.json frame.jpg

      - name: Úklid před publikací
        if: always()
        run: |
          rm -rf node_modules
          # rozbitý render nesmí na Pages nechat prázdný frame-data.json
          if [ ! -s frame.jpg ]; then rm -f frame.jpg frame-data.json; fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # zapne Pages samo při prvním běhu, není potřeba nic klikat
      - uses: actions/upload-pages-artifact@v3
        with: { path: '.' }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
