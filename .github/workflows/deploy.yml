name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # denně 5:00 SELČ – přegeneruje svátky, .ics a plakáty (dnešek + zítřek)
    - cron: '0 12 * * *'  # 14:00 SELČ – čerstvý zítřek pro TV, která na něj přepíná v 17:00 (běhy chodí i o hodiny později)
    - cron: '0 19 * * *'  # 21:00 SELČ – ještě jednou, kdyby odpolední běh nedoběhl
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # Než se vyrobí plakát a feed, stáhneme čerstvé ruční události z Google.
      # Kdyby Google zlobil, deploy nesmí spadnout — pojede se s posledními staženými daty.
      - name: Čerstvé události z Google Kalendáře
        continue-on-error: true
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: node scripts/google-pull.mjs

      - name: Vygenerovat svátky a ICS feed
        run: |
          node scripts/gen-svatky.mjs
          node scripts/plan-knihovna.mjs --write
          node scripts/build-ics.mjs

      - name: Commit vygenerovaných souborů
        run: |
          git config user.name  "rodinny-kalendar-bot"
          git config user.email "actions@github.com"
          git add data/svatky.json data/knihovna-plan.json data/events-google.json rodina.ics
          git diff --staged --quiet || git commit -m "chore: přegenerované svátky a ICS feed"
          git push
        continue-on-error: true

      # Plakáty pro The Frame (frame-auto/): vždy dnešek (frame.jpg) i zítřek (frame-zitra.jpg).
      # Uploader na Macu si vybere podle data — do 17:00 dnešek, od 17:00 zítřek — a když se
      # obsah plakátu změní (nová událost), nahraje ho znovu. Plánované běhy GitHubu chodí
      # i o 4–5 hodin později, proto se renderuje třikrát denně a oba dny najednou.
      - name: Plakáty pro The Frame
        continue-on-error: true   # když selže Chromium, web se nasadí i tak, jen bez plakátu
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/build-frame-data.mjs --posun 0 > frame-data.json
          node frame-auto/render/render.mjs frame-data.json frame.jpg
          node scripts/build-frame-data.mjs --posun 1 > frame-data-zitra.json
          node frame-auto/render/render.mjs frame-data-zitra.json frame-zitra.jpg

      - name: Úklid před publikací
        if: always()
        run: |
          rm -rf node_modules
          # rozbitý render nesmí na Pages nechat prázdný frame-data.json
          if [ ! -s frame.jpg ]; then rm -f frame.jpg frame-data.json; fi
          if [ ! -s frame-zitra.jpg ]; then rm -f frame-zitra.jpg frame-data-zitra.json; fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # zapne Pages samo při prvním běhu, není potřeba nic klikat
      - uses: actions/upload-pages-artifact@v3
        with: { path: '.' }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
