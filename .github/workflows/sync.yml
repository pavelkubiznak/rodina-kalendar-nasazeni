name: Sync s Google Kalendářem

# Dva směry, které se nikdy nepotkají:
#   pull  — kalendář „Rodina" (tam píše člověk)          → data/events-google.json
#   push  — data v gitu (rozvrhy, kroužky, svátky, …)    → kalendář „Rodina – automaticky"
# Díky tomu nemůže vzniknout smyčka ani konflikt: každá událost má právě jednoho vlastníka.

on:
  schedule:
    - cron: '7 * * * *'   # jednou za hodinu; GitHub plánované běhy stejně zpožďuje a */15 se prakticky nedodržovalo
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/udalosti.mjs'
      - 'scripts/google-*.mjs'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # nastartování Build & Deploy po commitu (push GITHUB_TOKENem další workflow nespouští)

# ať se dva běhy nepoperou o push do main
concurrency:
  group: google-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Stáhnout ruční události z Google
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: node scripts/google-pull.mjs

      - name: Commitnout, když se něco změnilo
        run: |
          git config user.name  "rodinny-kalendar-bot"
          git config user.email "actions@github.com"
          git add data/events-google.json
          if git diff --staged --quiet; then
            echo "Beze změny, není co commitovat."
          else
            git commit -m "sync: ruční události z Google Kalendáře"
            git pull --rebase --autostash origin main
            git push
            echo "ZMENA=1" >> "$GITHUB_ENV"
          fi

      # Push přes GITHUB_TOKEN schválně nespouští další workflow (ochrana proti smyčce),
      # takže Build & Deploy musíme po commitu ručních událostí nastartovat výslovně —
      # jinak by se web, feed a plakát přegenerovaly až při nejbližším denním běhu.
      - name: Přegenerovat web (Build & Deploy)
        if: env.ZMENA == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Nasypat generované události do Google
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: node scripts/google-push.mjs
